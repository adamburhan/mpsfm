# Olson-complete factor: bimodal rows = quadratic commitment to fitted modes
# with a null escape (w 0.05, sigma 3.0, threshold ~3.4 sigma); degenerate
# rows = current obs + calibrated sigma + the same null escape = principled
# robust unimodal (replaces Cauchy). Expected vs -null: control-kp drag gone,
# bimodal commitment wins kept.
reconstruction:
  image:
    normals:
      flip_consistency: true
    depth:
      mixture: true
      mixture_method: em
      mixture_radius: 4
      mixture_sig_floor: 0.01
      mixture_sep_min: 0.03
extractors:
  depth: metric3dv2-nfc
  normals: metric3dv2-nfc
dataset:
  resize_max: null
ba:
  depth_factor: maxmix
  depth_loss_name: trivial
  mixture_null_weight: 0.05
  mixture_degenerate_unimodal: true
