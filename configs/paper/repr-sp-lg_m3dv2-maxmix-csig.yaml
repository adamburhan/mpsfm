# Conditional-sigma arm: bimodal rows tightened to GT-measured conditional
# accuracy (scale 0.30 FROZEN from room scenes = calibration split; offices
# gave 0.36 = transfer check). Degenerate rows exact-baseline (v1); Cauchy
# loss. Pre-registered confirmatory set = the 14 office windows.
reconstruction:
  image:
    normals:
      flip_consistency: true
    depth:
      mixture: true
      mixture_method: em
      mixture_radius: 4
      mixture_sig_floor: 0.01
      mixture_sep_min: 0.03
extractors:
  depth: metric3dv2-nfc
  normals: metric3dv2-nfc
dataset:
  resize_max: null
ba:
  depth_factor: maxmix
  mixture_degenerate_unimodal: true
  mixture_sigma_scale: 0.30
  mixture_sigma_scale_bimodal_only: true
