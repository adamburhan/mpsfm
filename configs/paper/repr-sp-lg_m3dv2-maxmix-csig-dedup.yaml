# Intervention test of the measured over-counting mechanism: csig arm +
# information de-duplication (rho 0.8, radius 32px = MEASURED, not tuned).
# Pre-registered: pose safety restored (paired mean > -1) confirms causation.
reconstruction:
  image:
    normals:
      flip_consistency: true
    depth:
      mixture: true
      mixture_method: em
      mixture_radius: 4
      mixture_sig_floor: 0.01
      mixture_sep_min: 0.03
extractors:
  depth: metric3dv2-nfc
  normals: metric3dv2-nfc
dataset:
  resize_max: null
ba:
  depth_factor: maxmix
  mixture_degenerate_unimodal: true
  mixture_sigma_scale: 0.30
  mixture_sigma_scale_bimodal_only: true
  depth_info_dedup_rho: 0.8
