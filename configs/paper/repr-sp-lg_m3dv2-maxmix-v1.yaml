# v1 fix of repr-sp-lg_m3dv2-maxmix: degenerate mixture rows take the exact
# unimodal path (current obs depth + calibrated sigma) instead of the frozen
# fitted mode, so the factor differs from baseline ONLY at bimodal keypoints.
# Isolates routing from the accidental D*-feedback ablation at smooth kps.
reconstruction:
  image:
    normals:
      flip_consistency: true
    depth:
      mixture: true
      mixture_method: em
      mixture_radius: 4
      mixture_sig_floor: 0.01
      mixture_sep_min: 0.03
extractors:
  depth: metric3dv2-nfc
  normals: metric3dv2-nfc
dataset:
  resize_max: null
ba:
  depth_factor: maxmix
  mixture_degenerate_unimodal: true
