# Intervention test, dramatic version: the pose-annihilating null-v1 arm
# (-19.6 mean) + information de-duplication (rho 0.8, radius 32px, MEASURED).
# If dedup rescues THIS arm's poses, correlated over-counting is demonstrated
# by intervention, not just measurement.
reconstruction:
  image:
    normals:
      flip_consistency: true
    depth:
      mixture: true
      mixture_method: em
      mixture_radius: 4
      mixture_sig_floor: 0.01
      mixture_sep_min: 0.03
extractors:
  depth: metric3dv2-nfc
  normals: metric3dv2-nfc
dataset:
  resize_max: null
ba:
  depth_factor: maxmix
  depth_loss_name: trivial
  mixture_null_weight: 0.05
  mixture_degenerate_unimodal: true
  depth_info_dedup_rho: 0.8
