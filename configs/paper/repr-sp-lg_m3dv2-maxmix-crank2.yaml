# POSITIVE CONTROL 2: maxmix, 20x confidence AND trivial (quadratic) depth
# loss — removes the Cauchy influence cap so tight modes exert real force.
# Expected if wiring correct: depths snap onto winning modes, reconstruction
# violently prior-driven. Anything subtle = investigate the C++ factor.
reconstruction:
  image:
    normals:
      flip_consistency: true
    depth:
      mixture: true
      mixture_method: em
      mixture_radius: 4
      mixture_sig_floor: 0.01
      mixture_sep_min: 0.03
extractors:
  depth: metric3dv2-nfc
  normals: metric3dv2-nfc
dataset:
  resize_max: null
ba:
  depth_factor: maxmix
  mixture_sigma_scale: 0.05
  depth_loss_name: trivial
