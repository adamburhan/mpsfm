# Sigma-matched ablation of repr-sp-lg_m3dv2-maxmix: identical mixture fit,
# but the factor sees only the ANCHOR mode with its fitted sigma (mode 1
# dropped by repeating the anchor column -> degenerate rows -> exact unimodal
# factor path, gates inactive). If this arm reproduces maxmix's pose gains,
# the mechanism is sigma reweighting, not multimodality.
reconstruction:
  image:
    normals:
      flip_consistency: true
    depth:
      mixture: true
      mixture_method: em
      mixture_radius: 4
      mixture_sig_floor: 0.01
      mixture_sep_min: 0.03
extractors:
  depth: metric3dv2-nfc
  normals: metric3dv2-nfc
dataset:
  resize_max: null
ba:
  depth_factor: maxmix
  mixture_collapse_anchor: true
