# CONTROL 1 (uniform weakening): null-v1 + one GLOBAL sigma multiplier = 3.0,
# the MEASURED median of the dedup arm's per-point g — same average information
# reduction, NO spatial structure.
reconstruction:
  image:
    normals:
      flip_consistency: true
    depth:
      mixture: true
      mixture_method: em
      mixture_radius: 4
      mixture_sig_floor: 0.01
      mixture_sep_min: 0.03
extractors:
  depth: metric3dv2-nfc
  normals: metric3dv2-nfc
dataset:
  resize_max: null
ba:
  depth_factor: maxmix
  depth_loss_name: trivial
  mixture_null_weight: 0.05
  mixture_degenerate_unimodal: true
  depth_info_dedup_uniform: 3.0
