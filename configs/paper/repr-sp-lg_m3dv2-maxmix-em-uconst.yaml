# Engagement-sweep maxmix arm (EM mixture fit): constant 1% relative depth
# uncertainty, tightened mixture sigmas/separation so the bimodal factors
# actually bite. Identical to repr-sp-lg_m3dv2-uconst except mixture/ba.
reconstruction:
  image:
    normals:
      flip_consistency: true
    depth:
      # prior_uncertainty: false
      # depth_uncertainty: 0.1
      mixture: true
      mixture_method: em
      mixture_radius: 4
      mixture_sig_floor: 0.01
      mixture_sep_min: 0.03
extractors:
  depth: metric3dv2-nfc
  normals: metric3dv2-nfc
dataset:
  resize_max: null
ba:
  depth_factor: maxmix
  scale_filter: false
integrate: false